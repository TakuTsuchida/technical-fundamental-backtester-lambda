[project]
name = "technical-fundamental-backtester-lambda"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "shared",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "boto3-stubs[lambda,s3,sqs,ssm]>=1.34",
    "moto[s3,sqs,ssm]>=5.0",
]
token-refresher = []
dispatcher      = []
worker          = [
    "pyarrow>=16.0",
]

[tool.ruff]
target-version = "py312"
line-length    = 100
src            = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version         = "3.12"
strict                 = true
explicit_package_bases = true
mypy_path              = "src"

[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths  = ["tests"]
pythonpath = ["src"]
addopts    = "--tb=short -q"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["src/shared"]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"
