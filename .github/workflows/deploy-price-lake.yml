name: Deploy Price Lake (Docker)

on:
  push:
    branches:
      - main
    paths:
      - "src/price_lake/**"
      - "src/shared/**"
      - "Makefile"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_PRICE_LAKE_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Deploy price_lake
        env:
          ECR_URI_PRICE_LAKE: ${{ secrets.ECR_REPOSITORY_URI_PRICE_LAKE }}
        run: make deploy-price-lake
