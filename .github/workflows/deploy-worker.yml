name: Deploy Worker (Docker)

on:
  push:
    branches:
      - main
    paths:
      - "src/worker/**"
      - "src/shared/**"
      - "Makefile"
  workflow_dispatch: # OIDC verification — remove after confirmed

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_WORKER_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Deploy worker
        env:
          ECR_URI: ${{ secrets.ECR_REPOSITORY_URI }}
        run: make deploy-worker
